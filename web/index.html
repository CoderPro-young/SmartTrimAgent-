<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartTrimAgent · 视频剪辑 Agent</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel2:#1c2129; --line:#262c37;
    --text:#e6e9ef; --muted:#8b93a3; --dim:#666e7d;
    --accent:#7c9cff; --accent2:#b08cff;
    --ok:#3ddc84; --bad:#ff6b6b; --warn:#ffc14d;
    --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:14px;padding:12px 18px;
    background:linear-gradient(180deg,#191e27,#141820);border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:.2px}
  .logo .mark{
    width:26px;height:26px;border-radius:7px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-size:13px;color:#0e1116;font-weight:800;
  }
  .logo small{font-weight:400;color:var(--muted);font-size:12px;margin-left:2px}
  .grow{flex:1}
  .pill{
    font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel2);color:var(--muted);white-space:nowrap;
  }
  .pill.ok{color:var(--ok);border-color:rgba(61,220,132,.35);background:rgba(61,220,132,.08)}
  .pill.bad{color:var(--bad);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.08)}
  /* ---------- layout ---------- */
  main{flex:1;display:grid;grid-template-columns:minmax(360px,44fr) 56fr;min-height:0}
  .col{display:flex;flex-direction:column;min-height:0;min-width:0}
  .col.left{border-right:1px solid var(--line)}
  .colhead{
    padding:10px 16px;font-size:12px;color:var(--muted);letter-spacing:.5px;
    text-transform:uppercase;border-bottom:1px solid var(--line);flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
  }
  .scroll{overflow-y:auto;overflow-x:hidden;padding:16px;flex:1;min-height:0}
  .scroll::-webkit-scrollbar{width:10px}
  .scroll::-webkit-scrollbar-thumb{background:#2b313c;border-radius:6px}
  .scroll::-webkit-scrollbar-track{background:transparent}
  /* ---------- chat ---------- */
  #msgs{display:flex;flex-direction:column;gap:14px}
  .msg{max-width:100%}
  .who{font-size:11px;color:var(--dim);margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase}
  .bubble{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 13px;white-space:pre-wrap;word-break:break-word;
  }
  .msg.user .bubble{background:rgba(124,156,255,.10);border-color:rgba(124,156,255,.28)}
  .tc{margin-top:9px;display:flex;flex-direction:column;gap:6px}
  .tc-item{
    border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden;
  }
  .tc-item>summary{
    cursor:pointer;padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:7px;
    list-style:none;user-select:none;
  }
  .tc-item>summary::-webkit-details-marker{display:none}
  .tc-item>summary::before{content:"▸";color:var(--dim);font-size:10px;transition:transform .15s}
  .tc-item[open]>summary::before{transform:rotate(90deg)}
  .tc-name{font-family:var(--mono);color:var(--accent);font-size:12px}
  pre{
    margin:0;padding:10px 12px;background:#12161d;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:11.5px;line-height:1.55;overflow-x:auto;
    max-height:280px;overflow-y:auto;color:#c9d1e0;
  }
  .sys-line{
    font-size:12px;color:var(--muted);padding:2px 0;display:flex;gap:8px;align-items:baseline;
  }
  .sys-line .dot{width:5px;height:5px;border-radius:50%;background:var(--dim);flex:0 0 auto;position:relative;top:-3px}
  .sys-line.run .dot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .err{
    border:1px solid rgba(255,107,107,.4);background:rgba(255,107,107,.08);
    border-radius:9px;padding:10px 13px;color:#ffb3b3;
  }
  /* ---------- 反问 / 幻觉标记 ---------- */
  .qtag{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;
    padding:1px 7px;border-radius:5px;margin-bottom:6px;
    background:rgba(255,193,77,.16);color:var(--warn);
  }
  .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .opt{
    font-size:11.5px;padding:4px 10px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(255,193,77,.45);background:rgba(255,193,77,.10);
    color:var(--warn);transition:.15s;white-space:nowrap;
  }
  .opt:hover{background:rgba(255,193,77,.24);color:#ffd699}
  .hallu{
    font-size:12px;color:var(--warn);border:1px solid rgba(255,193,77,.35);
    background:rgba(255,193,77,.07);border-radius:8px;padding:7px 11px;
  }
  /* ---------- composer ---------- */
  .composer{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 14px 12px;background:var(--panel)}
  .toolbar{display:flex;align-items:center;gap:2px;margin-bottom:8px}
  .btn-flat{
    font:inherit;font-size:12px;font-weight:500;background:none;border:none;
    color:var(--muted);cursor:pointer;padding:3px 8px;border-radius:6px;white-space:nowrap;
  }
  .btn-flat:hover{color:var(--accent);background:rgba(124,156,255,.08)}
  .btn-flat:disabled{opacity:.4;cursor:not-allowed}
  .tsep{width:1px;height:12px;background:var(--line);margin:0 4px;flex:0 0 auto}
  .toolbar .grow{flex:1}
  .toolbar .keys{font-size:11px;color:var(--dim)}
  .inputrow{display:flex;gap:9px;align-items:flex-end}
  textarea{
    flex:1;resize:none;min-height:44px;max-height:150px;padding:10px 12px;
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:9px;font:inherit;font-size:13.5px;outline:none;
  }
  textarea:focus{border-color:rgba(124,156,255,.55);box-shadow:0 0 0 3px rgba(124,156,255,.10)}
  button{
    font:inherit;font-weight:600;font-size:13.5px;padding:10px 20px;border-radius:9px;
    border:1px solid transparent;cursor:pointer;white-space:nowrap;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0d1016;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  .hint{font-size:11px;color:var(--dim);margin-top:7px}
  /* ---------- 成品播放器（限高缩小，居中） ---------- */
  #cardResult .body{display:flex;flex-direction:column;align-items:center}
  #player{max-width:100%;max-height:300px;width:auto;border-radius:9px;background:#000;
          display:block;border:1px solid var(--line);object-fit:contain}
  /* ---------- 素材（右栏列表 + 预览） ---------- */
  .col.left{position:relative}
  .matwrap{display:flex;flex-direction:column;gap:10px}
  .matlist{
    display:flex;flex-wrap:wrap;gap:6px;
    max-height:136px;overflow-y:auto;padding-right:2px;
  }
  .mat{
    display:flex;align-items:center;gap:8px;flex:1 1 270px;min-width:200px;
    font-size:12px;padding:6px 8px;
    border:1px solid var(--line);border-radius:8px;background:var(--panel2);
    cursor:pointer;transition:.15s;position:relative;overflow:hidden;
  }
  .mat:hover{border-color:rgba(124,156,255,.5);background:#232a35}
  .mat.on{border-color:rgba(124,156,255,.75);background:rgba(124,156,255,.10)}
  .mat .kind{font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:2px 5px;
             border-radius:4px;flex:0 0 auto}
  .mat .kind.video{background:rgba(124,156,255,.16);color:var(--accent)}
  .mat .kind.image{background:rgba(61,220,132,.14);color:var(--ok)}
  .mat .kind.audio{background:rgba(255,193,77,.14);color:var(--warn)}
  .mat .nmwrap{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .mat .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mat .meta{color:var(--dim);font-size:10.5px;font-family:var(--mono);
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mat .act,.mat .del{
    flex:0 0 auto;font-size:10.5px;color:var(--dim);
    border:1px solid var(--line);border-radius:5px;padding:1px 6px;line-height:1.5;
  }
  .mat .act:hover{color:var(--accent);border-color:rgba(124,156,255,.5)}
  .mat .del:hover{color:var(--bad);border-color:rgba(255,107,107,.5)}
  .mat .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);
            width:0;transition:width .2s}
  .mat.up{border-style:dashed;opacity:.85;cursor:default}
  .mat.err{border-color:rgba(255,107,107,.5);color:#ffb3b3;cursor:default}
  .matprev{
    min-height:240px;padding:12px;border-radius:9px;
    border:1px dashed var(--line);background:#0b0d11;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  }
  .matprev img,.matprev video{
    max-width:100%;max-height:330px;display:block;border-radius:7px;background:#000;
  }
  .matprev audio{width:min(100%,420px)}
  .matprev .cap{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7;
                word-break:break-all;max-width:100%}
  .matprev .cap a{color:var(--accent);text-decoration:none}
  .matprev .cap a:hover{text-decoration:underline}
  .dropover{
    position:absolute;inset:0;z-index:20;display:none;place-items:center;
    background:rgba(124,156,255,.10);border:2px dashed rgba(124,156,255,.6);
    border-radius:10px;font-size:15px;font-weight:600;color:var(--accent);pointer-events:none;
  }
  .dropover.on{display:grid}
  /* ---------- inspector ---------- */
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    margin-bottom:14px;overflow:hidden;
  }
  .card>h3{
    margin:0;padding:9px 13px;font-size:12px;font-weight:600;letter-spacing:.3px;
    color:var(--muted);border-bottom:1px solid var(--line);background:var(--panel2);
    display:flex;align-items:center;gap:8px;
  }
  .card>h3 .grow{flex:1}
  .card .body{padding:12px 13px}
  .empty{color:var(--dim);font-size:12.5px;font-style:italic}
  /* stat grid */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .stat .k{font-size:10.5px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}
  .stat .v{font-family:var(--mono);font-size:14px;color:var(--accent);margin-top:2px}
  /* commands */
  .cmd{border-top:1px solid var(--line);padding:10px 0}
  .cmd:first-child{border-top:0;padding-top:0}
  .cmd .meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .stage{
    font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    padding:2px 7px;border-radius:5px;
  }
  .stage.detect{background:rgba(255,193,77,.14);color:var(--warn)}
  .stage.normalize{background:rgba(124,156,255,.14);color:var(--accent)}
  .stage.render{background:rgba(176,140,255,.16);color:var(--accent2)}
  .cmd .desc{font-size:12.5px;color:var(--text)}
  .cmd code{
    display:block;font-family:var(--mono);font-size:11.5px;line-height:1.6;color:#a9b4c8;
    background:#12161d;border:1px solid var(--line);border-radius:7px;padding:9px 11px;
    white-space:pre-wrap;word-break:break-all;
  }
  /* log */
  .log{display:flex;flex-direction:column;gap:7px}
  .logrow{display:flex;gap:9px;align-items:flex-start;font-size:12.5px}
  .badge{
    font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;flex:0 0 auto;
    position:relative;top:2px;
  }
  .badge.ok{background:rgba(61,220,132,.14);color:var(--ok)}
  .badge.fail{background:rgba(255,107,107,.14);color:var(--bad)}
  /* result */
  video{max-width:100%;border-radius:9px;background:#000;display:block;border:1px solid var(--line)}
  .resultbar{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .resultbar a{
    color:var(--accent);text-decoration:none;font-size:12.5px;
    border:1px solid rgba(124,156,255,.3);padding:4px 10px;border-radius:7px;
  }
  .resultbar a:hover{background:rgba(124,156,255,.1)}
  .verify{font-size:12.5px;display:flex;align-items:center;gap:6px}
  @media (max-width:940px){
    main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    .col.left{border-right:0;border-bottom:1px solid var(--line)}
    .matprev{min-height:170px}
  }
</style>
</head>
<body>
<header>
  <div class="logo">
    <span class="mark">ST</span>
    <span>SmartTrimAgent<small>· 视频剪辑 Agent</small></span>
  </div>
  <div class="grow"></div>
  <span class="pill" id="modelPill">模型加载中…</span>
  <span class="pill" id="ffPill">检测 ffmpeg…</span>
</header>

<main>
  <!-- ========== 左：对话 ========== -->
  <section class="col left">
    <div class="colhead">任务对话</div>
    <div class="scroll" id="chatScroll"><div id="msgs"></div></div>
    <div class="composer">
      <input type="file" id="fileInput" multiple hidden>
      <div class="toolbar">
        <button class="btn-flat" id="newTaskBtn">启动新任务</button>
        <span class="tsep"></span>
        <button class="btn-flat" id="pickBtn">＋ 上传素材</button>
        <span class="grow"></span>
        <span class="keys">Enter 运行 · Shift+Enter 换行</span>
      </div>
      <div class="inputrow">
        <textarea id="task" placeholder="先用一句话描述要剪成什么样，例如：把这两段拼起来，中间加 0.5 秒 fade 转场，输出 720p"></textarea>
        <button id="send">运行</button>
      </div>
      <div class="hint">本轮出片后可继续提修改要求 · 「启动新任务」重开一局并刷新素材 · 也可把文件直接拖到左侧上传</div>
    </div>
    <div class="dropover" id="dropover">松开以上传素材</div>
  </section>

  <!-- ========== 右：素材 + 流水线 ========== -->
  <section class="col right">
    <div class="colhead">流水线检视<span class="grow"></span><span id="elapsed"></span></div>
    <div class="scroll">
      <div class="card">
        <h3>素材 · INPUT/<span class="grow"></span>
          <span style="color:var(--dim);font-size:11px" id="matMeta"></span></h3>
        <div class="body">
          <div class="matwrap">
            <div class="matlist" id="matList"><span class="empty">加载中…</span></div>
            <div class="matprev" id="matPrev"><span class="empty">点上方素材即可预览</span></div>
          </div>
        </div>
      </div>

      <div class="card" id="cardResult" hidden>
        <h3>成品 <span class="grow"></span><span class="verify" id="verifyBox"></span></h3>
        <div class="body">
          <video id="player" controls playsinline preload="metadata"></video>
          <div class="resultbar">
            <a id="dl" download>下载 / 打开原视频</a>
            <span id="outMeta" style="color:var(--muted);font-size:12.5px"></span>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>编辑计划 JSON<span class="grow"></span><span style="color:var(--dim);font-size:11px" id="planMeta"></span></h3>
        <div class="body" id="planBody"><span class="empty">等待 agent 提交 submit_plan…</span></div>
      </div>

      <div class="card">
        <h3>时间轴换算</h3>
        <div class="body" id="mathBody"><span class="empty">编译后显示片段时长 / 起点 / 总时长</span></div>
      </div>

      <div class="card">
        <h3>ffmpeg 命令序列</h3>
        <div class="body" id="cmdBody"><span class="empty">等待编译器生成命令…</span></div>
      </div>

      <div class="card">
        <h3>执行日志</h3>
        <div class="body" id="logBody"><span class="empty">尚未执行</span></div>
      </div>

      <div class="card">
        <h3>历史产物</h3>
        <div class="body" id="outBody"><span class="empty">—</span></div>
      </div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const msgsEl = $('#msgs'), chatScroll = $('#chatScroll');
let busy = false, t0 = 0, timer = null;
let hasMaterials = null;   // null=未知（不禁用运行键）· true/false=已确认

/* ---------- 会话（v3.1）：一个 session_id 活到点「启动新任务」为止 ---------- */
const PH_FIRST = '先用一句话描述要剪成什么样，例如：把这两段拼起来，中间加 0.5 秒 fade 转场，输出 720p';
const PH_MORE  = '继续提修改要求，例如：把花字改成 3 秒 / 输出换成 1080p；没看懂它的反问也可以直接回答';
const WELCOME  = '还没有素材 —— 先把视频/图片拖进左侧，再用一句话描述要剪成什么样。';
function _newSessionId(){
  return (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
let sessionId = localStorage.getItem('st_session');
if (!sessionId){ sessionId = _newSessionId(); localStorage.setItem('st_session', sessionId); }
let turnCount = parseInt(localStorage.getItem('st_turns_' + sessionId) || '0', 10);

/* ---------- 小工具 ---------- */
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function scrollDown(){ chatScroll.scrollTop = chatScroll.scrollHeight; }
function refreshPlaceholder(){
  $('#task').placeholder = turnCount > 0 ? PH_MORE : PH_FIRST;
}
function jsonBlock(obj){
  const pre = el('pre', null, JSON.stringify(obj, null, 2));
  return pre;
}

/* ---------- 对话渲染 ---------- */
function addUser(text){
  const m = el('div', 'msg user');
  m.append(el('div', 'who', '你'), (() => { const b = el('div','bubble'); b.textContent = text; return b; })());
  msgsEl.append(m); scrollDown();
}
function addSys(text, running){
  const m = el('div', 'msg sys');
  const line = el('div', 'sys-line' + (running ? ' run' : ''));
  line.append(el('span', 'dot'), el('span', null, text));
  m.append(line); msgsEl.append(m); scrollDown();
  return line;
}
function addAssistant(text, toolCalls){
  const m = el('div', 'msg');
  m.append(el('div', 'who', 'agent'));
  if (text) { const b = el('div','bubble'); b.textContent = text; m.append(b); }
  if (toolCalls && toolCalls.length){
    const wrap = el('div', 'tc');
    for (const tc of toolCalls){
      const d = el('details', 'tc-item');
      const s = el('summary');
      s.append(el('span', 'tc-name', tc.name || '?'));
      const n = JSON.stringify(tc.args ?? {});
      s.append(el('span', null, n.length > 68 ? n.slice(0,68) + ' …' : n));
      d.append(s, jsonBlock(tc.args ?? {}));
      // submit_plan 的完整计划已在右侧展示，这里默认折叠
      wrap.append(d);
    }
    m.append(wrap);
  }
  msgsEl.append(m); scrollDown();
}
function addError(text){
  const m = el('div', 'msg');
  m.append(el('div', 'who', '错误'));
  const d = el('div', 'err'); d.textContent = text;
  m.append(d); msgsEl.append(m); scrollDown();
}
/* agent 反问：气泡 + 可点选项（点击填进输入框，不自动提交） */
function addQuestion(question, options){
  const m = el('div', 'msg');
  m.append(el('div', 'who', 'agent · 反问'));
  const b = el('div', 'bubble');
  b.append(el('span', 'qtag', '需要确认'));
  b.append(el('div', null, question || '需要确认一下你的要求。'));
  if (options && options.length){
    const w = el('div', 'opts');
    for (const o of options){
      const c = el('span', 'opt', o);
      c.title = '填进输入框，可补充后再运行';
      c.onclick = () => insertText(o);
      w.append(c);
    }
    b.append(w);
  }
  m.append(b); msgsEl.append(m); scrollDown();
}
/* 幻觉标记：只提示不拦截（warn 琥珀 / error 红） */
function addHallucination(ev){
  const m = el('div', 'msg');
  m.append(el('div', 'who', '系统提示'));
  const d = el('div', 'hallu');
  d.textContent = (ev.level === 'error' ? '幻觉纠偏失败，请人工确认' : '疑似幻觉')
    + `（${ev.signal || '?'}）：${ev.evidence || ''}`;
  m.append(d); msgsEl.append(m); scrollDown();
}

/* ---------- 右侧面板 ---------- */
function resetPanels(){
  $('#planBody').innerHTML = '<span class="empty">等待 agent 提交 submit_plan…</span>';
  $('#mathBody').innerHTML = '<span class="empty">编译后显示片段时长 / 起点 / 总时长</span>';
  $('#cmdBody').innerHTML = '<span class="empty">等待编译器生成命令…</span>';
  $('#logBody').innerHTML = '<span class="empty">尚未执行</span>';
  $('#planMeta').textContent = '';
  $('#verifyBox').textContent = '';
  $('#cardResult').hidden = true;
  $('#player').removeAttribute('src');
}

function renderPlan(plan){
  $('#planBody').replaceChildren(jsonBlock(plan));
  const clips = (plan.clips || []).length, tl = (plan.timeline || []).length;
  const ov = (plan.overlays || []).length;
  $('#planMeta').textContent = `${clips} 素材 · ${tl} 时间轴项 · ${ov} 叠加`;
}

function renderMath(m, plan){
  const box = $('#mathBody'); box.replaceChildren();
  const grid = el('div', 'stats');
  const order = m.order || [];
  const dl = order.map(id => `${id}=${m.durations[id]}s`).join('  ');
  const sl = order.map(id => `${id}=${m.starts[id]}s`).join('  ');
  const kv = [
    ['画布', `${m.width}×${m.height}`],
    ['帧率', `${m.fps} fps`],
    ['片段时长 d_i', dl],
    ['片段起点 S_i', sl],
    ['总时长 D', `${m.D} s`],
  ];
  for (const [k, v] of kv){
    const s = el('div', 'stat');
    s.append(el('div', 'k', k), el('div', 'v', v));
    grid.append(s);
  }
  box.append(grid);

  const ovs = m.overlays || [];
  if (ovs.length){
    const t = el('div', null);
    t.style.cssText = 'margin-top:11px;font-size:12.5px;color:var(--muted)';
    t.textContent = '叠加绝对时间：' + ovs.map(o =>
      `${o.type} @ ${o.at_clip} → ${o.start}s~${o.end}s`).join('　|　');
    box.append(t);
  }
  if ((m.transitions && Object.keys(m.transitions).length)){
    const t = el('div', null);
    t.style.cssText = 'margin-top:7px;font-size:12.5px;color:var(--muted)';
    const xs = Object.entries(m.transitions)
      .filter(([, v]) => v)
      .map(([i, v]) => `#${i} ${v.type} ${v.duration}s`);
    if (xs.length) t.textContent = '转场（挂在第 N 个时间轴项上）：' + xs.join('　|　');
    box.append(t);
  }
}

function renderCommands(cmds){
  const box = $('#cmdBody'); box.replaceChildren();
  for (const c of cmds){
    const d = el('div', 'cmd');
    const meta = el('div', 'meta');
    meta.append(el('span', 'stage ' + c.stage, c.stage), el('span', 'desc', c.description));
    d.append(meta, el('code', null, c.line));
    box.append(d);
  }
}

let logRows = null;
function appendLog(ok, desc, detail){
  if (!logRows){ logRows = el('div', 'log'); $('#logBody').replaceChildren(logRows); }
  const row = el('div', 'logrow');
  row.append(el('span', 'badge ' + (ok ? 'ok' : 'fail'), ok ? 'OK' : 'FAIL'),
             el('span', null, desc || ''));
  logRows.append(row);
  if (detail){
    row.append(jsonBlock(detail));
    row.lastChild.style.flexBasis = '100%';
  }
}

function renderVerify(v){
  const box = $('#verifyBox'); box.replaceChildren();
  const ok = v && v.ok;
  const span = el('span', 'pill ' + (ok ? 'ok' : 'bad'));
  if (v && v.duration != null){
    span.textContent = `回验 ${ok ? '通过' : '不一致'} · 实际 ${v.duration}s / 预期 ${v.expected}s`;
  } else {
    span.textContent = '回验：' + ((v && (v.note || v.error)) || '无结果');
  }
  box.append(span);
}

function showResult(ev){
  const card = $('#cardResult');
  card.hidden = false;
  const p = $('#player');
  p.src = ev.url;
  const a = $('#dl'); a.href = ev.url; a.setAttribute('download', ev.output.split('/').pop());
  $('#outMeta').textContent = ev.output;
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- 事件分发 ---------- */
function handleEvent(ev){
  switch (ev.type){
    case 'attempt':
      if (ev.max > 1) addSys(`第 ${ev.n}/${ev.max} 轮：让 agent 出编辑计划…`, true);
      else addSys('正在分析素材并生成编辑计划…', true);
      break;
    case 'materials': addSys('本次可用素材：' + ev.names.join('、'), false); break;
    case 'llm':      addAssistant(ev.text, ev.tool_calls); break;
    case 'plan':     renderPlan(ev.plan); break;
    case 'math':     renderMath(ev.math, null); break;
    case 'commands': renderCommands(ev.commands); break;
    case 'status':   addSys(ev.text, true); break;
    case 'exec':     appendLog(ev.ok, ev.description, ev.ok ? null : (ev.error || ev.stderr_tail)); break;
    case 'verify':   renderVerify(ev.verify); break;
    case 'done':
      turnCount += 1;
      localStorage.setItem('st_turns_' + sessionId, String(turnCount));
      refreshPlaceholder();
      showResult(ev); loadOutputs(); break;
    case 'compile_error':
      addSys('计划未通过编译器校验：', false);
      addError(ev.errors.map(e => '· ' + e).join('\n')); break;
    case 'error':    addError(ev.message); break;
    case 'traceback':addSys('内部堆栈已折叠', false); break;
    case 'question': addQuestion(ev.question, ev.options); break;
    case 'hallucination': addHallucination(ev); break;
  }
}

/* ---------- 运行 ---------- */
async function run(task){
  busy = true;
  refreshSendState();
  resetPanels(); logRows = null;
  addUser(task);

  t0 = performance.now();
  timer = setInterval(() => {
    $('#elapsed').textContent = ((performance.now() - t0) / 1000).toFixed(1) + ' s';
  }, 100);

  try {
    const resp = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task, session_id: sessionId })
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;){
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line) continue;
        let ev;
        try { ev = JSON.parse(line); } catch { continue; }
        handleEvent(ev);
      }
    }
    addSys('本轮结束。', false);
  } catch (e){
    addError('请求失败：' + e.message);
  } finally {
    clearInterval(timer);
    $('#elapsed').textContent = ((performance.now() - t0) / 1000).toFixed(1) + ' s';
    busy = false;
    refreshSendState();
  }
}

/* ---------- 素材：列表 / 上传 / 删除 ---------- */
function fmtSize(n){
  if (n >= 1048576) return (n / 1048576).toFixed(1) + 'MB';
  if (n >= 1024) return (n / 1024).toFixed(0) + 'KB';
  return n + 'B';
}
function fmtMeta(it){
  const p = it.probe;
  if (!p || !p.ok) return fmtSize(it.size);
  const bits = [];
  if (p.width) bits.push(p.width + '×' + p.height);
  if (p.duration != null) bits.push(p.duration + 's');
  else if (it.kind === 'image') bits.push('静图');
  if (p.fps) bits.push(p.fps + 'fps');
  if (it.kind === 'audio'){
    if (p.channels) bits.push(p.channels + 'ch');
    if (p.sample_rate) bits.push(Math.round(p.sample_rate / 1000) + 'kHz');
    if (p.codec) bits.push(p.codec);
  } else if (p.has_audio === false) bits.push('无音轨');
  bits.push(fmtSize(it.size));
  return bits.join(' · ');
}
/* 列表格子窄，只留最关键的几项；完整信息在预览区的说明行里 */
function fmtChip(it){
  const p = it.probe;
  if (!p || !p.ok) return fmtSize(it.size);
  const bits = [];
  if (p.width) bits.push(p.width + '×' + p.height);
  if (p.duration != null) bits.push(p.duration + 's');
  else if (it.kind === 'image') bits.push('静图');
  if (it.kind === 'audio' && p.channels) bits.push(p.channels + 'ch');
  bits.push(fmtSize(it.size));
  return bits.join(' · ');
}
function insertText(s){
  const ta = $('#task');
  const pos = ta.selectionStart ?? ta.value.length;
  const pre = ta.value.slice(0, pos), post = ta.value.slice(pos);
  ta.value = pre + (pre && !/\s$/.test(pre) ? ' ' : '') + s + post;
  ta.focus();
  ta.dispatchEvent(new Event('input'));
}

const KIND_LABEL = { video: 'VIDEO', image: 'IMG', audio: 'AUDIO' };
let selectedMat = null;        // 当前预览中的素材名（刷新列表后用于保持高亮）

/* 点素材行 → 在右侧预览区展示原始素材 */
function showPreview(it){
  selectedMat = it ? it.name : null;
  for (const n of document.querySelectorAll('#matList .mat'))
    n.classList.toggle('on', n.dataset.name === selectedMat);

  const box = $('#matPrev'); box.replaceChildren();
  if (!it){ box.append(el('span', 'empty', '点上方素材即可预览')); return; }

  const url = it.url || matUrl(it.name);
  let media;
  if (it.kind === 'image')      media = el('img');
  else if (it.kind === 'audio'){ media = el('audio'); media.controls = true; }
  else                         { media = el('video'); media.controls = true; }
  media.src = url;
  if (media.tagName !== 'IMG') media.preload = 'metadata';
  media.onerror = () => {
    media.remove();
    box.prepend(el('div', 'empty', '浏览器解不开这个格式（常见于 hevc / mkv），点下方链接用本地播放器打开。'));
  };
  box.append(media);

  const cap = el('div', 'cap');
  cap.append(el('div', null, it.path + ' · ' + fmtMeta(it)));
  const a = el('a', null, '在新标签打开 / 下载');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  cap.append(a);
  box.append(cap);
}

function matUrl(name){ return '/input/' + encodeURIComponent(name); }

function matRow(it){
  const node = el('div', 'mat');
  node.dataset.name = it.name;
  node.title = it.path + (it.uploaded ? '（网页上传，可移除）' : '（非网页上传的文件，不在此处移除）');
  node.append(el('span', 'kind ' + it.kind, KIND_LABEL[it.kind] || 'FILE'));
  const wrap = el('div', 'nmwrap');
  const nm = el('div', 'nm', it.name);
  const meta = el('div', 'meta', fmtChip(it));
  nm.title = it.path; meta.title = fmtMeta(it);
  wrap.append(nm, meta);
  node.append(wrap);

  const act = el('span', 'act', '引用');
  act.title = '把路径插入到下面的需求输入框';
  act.onclick = e => { e.stopPropagation(); insertText(it.path); };
  node.append(act);

  if (it.uploaded){
    const del = el('span', 'del', '×');
    del.title = '把素材移出 INPUT/（不再提供给 agent）';
    del.onclick = async e => {
      e.stopPropagation();
      if (!confirm('把素材 ' + it.name + ' 移出 INPUT/ ？')) return;
      try {
        const r = await fetch('/api/delete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: it.name })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) { addError('移除失败：' + (j.error || ('HTTP ' + r.status))); return; }
        addSys(j.mode === 'moved'
          ? `已把「${it.name}」移出素材区（当前环境不允许真删，文件在 ${j.detail}）`
          : `已删除素材「${it.name}」`, false);
        if (selectedMat === it.name) showPreview(null);
        loadInputs();
      } catch (err){ addError('移除失败：' + err.message); }
    };
    node.append(del);
  }

  node.onclick = () => showPreview(it);
  return node;
}

async function loadInputs(){
  const box = $('#matList');
  try {
    const d = await (await fetch('/api/inputs?probe=1')).json();
    const items = d.inputs || [];
    hasMaterials = items.length > 0;
    box.replaceChildren();
    if (!items.length){
      box.append(el('span', 'empty', '还没有素材 —— 点下方「＋ 上传素材」，或把文件拖到左侧面板'));
      showPreview(null);
    } else {
      for (const it of items) box.append(matRow(it));
      // 刷新后保持原来的选中项；若那个素材已被移除，则清空预览
      showPreview(items.find(x => x.name === selectedMat) || null);
    }
    $('#matMeta').textContent = items.length ? `${items.length} 个素材` : '';
  } catch (e){
    hasMaterials = null;                       // 情况不明就别锁住运行键
    box.replaceChildren(el('span', 'empty', '素材列表加载失败'));
  }
  refreshSendState();
}

function refreshSendState(){
  const btn = $('#send');
  btn.disabled = busy || hasMaterials === false;
  btn.title = hasMaterials === false ? '请先上传素材' : '';
}

function uploadFile(file){
  return new Promise(resolve => {
    const box = $('#matList');
    const isImg = /^image\//.test(file.type) || /\.(png|jpe?g|jfif|webp|bmp|gif|tiff?|heic|avif)$/i.test(file.name);
    const kind = isImg ? 'image' : 'video';
    const node = el('div', 'mat up');
    node.append(el('span', 'kind ' + kind, isImg ? 'IMG' : 'VIDEO'));
    const wrap = el('div', 'nmwrap');
    const meta = el('div', 'meta', '上传中 0%');
    wrap.append(el('div', 'nm', file.name), meta);
    node.append(wrap);
    const bar = el('div', 'bar');
    node.append(bar);
    const empty = box.querySelector('.empty');
    if (empty) empty.remove();
    box.prepend(node);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload?name=' + encodeURIComponent(file.name));
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const pc = Math.round(e.loaded / e.total * 100);
      meta.textContent = '上传中 ' + pc + '%';
      bar.style.width = pc + '%';
    };
    xhr.onload = () => {
      let j = {};
      try { j = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 200 && j.ok){
        meta.textContent = '校验中…';
        if (j.renamed) addSys(`「${file.name}」与已有文件重名，已存为 ${j.name}`, false);
        loadInputs();
        resolve(true);
      } else {
        node.classList.remove('up');
        node.classList.add('err');
        meta.textContent = '已拒绝';
        bar.remove();
        const del = el('span', 'del', '×');
        del.title = '移除这条记录';
        del.onclick = ev => { ev.stopPropagation(); node.remove(); };
        node.append(del);
        addError(`上传 ${file.name} 被拒绝：${j.error || ('HTTP ' + xhr.status)}`);
        resolve(false);
      }
    };
    xhr.onerror = () => {
      node.classList.remove('up'); node.classList.add('err');
      meta.textContent = '网络错误'; bar.remove();
      resolve(false);
    };
    xhr.send(file);
  });
}

async function uploadFiles(files){
  const list = Array.from(files || []);
  if (!list.length) return;
  addSys(`开始上传 ${list.length} 个素材…`, true);
  let ok = 0;
  for (const f of list) if (await uploadFile(f)) ok++;
  addSys(`上传完成：${ok}/${list.length} 个可用。`, false);
}

function initUploads(){
  $('#pickBtn').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = e => { uploadFiles(e.target.files); e.target.value = ''; };

  const col = document.querySelector('.col.left');
  const over = $('#dropover');
  let depth = 0;
  col.addEventListener('dragenter', e => { e.preventDefault(); depth++; over.classList.add('on'); });
  col.addEventListener('dragover', e => e.preventDefault());
  col.addEventListener('dragleave', () => { if (--depth <= 0){ depth = 0; over.classList.remove('on'); } });
  col.addEventListener('drop', e => {
    e.preventDefault(); depth = 0; over.classList.remove('on');
    if (e.dataTransfer && e.dataTransfer.files) uploadFiles(e.dataTransfer.files);
  });
  // 拖到页面别处时别让浏览器直接打开文件
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());
}

/* ---------- 初始化 ---------- */
async function loadOutputs(){
  try {
    const d = await (await fetch('/api/outputs')).json();
    const box = $('#outBody'); box.replaceChildren();
    if (!d.outputs.length){ box.append(el('span', 'empty', 'OUTPUT/ 下还没有产物')); return; }
    for (const o of d.outputs){
      const row = el('div', 'logrow');
      const a = el('a', null, o.name);
      a.href = o.url; a.style.cssText = 'color:var(--accent);text-decoration:none';
      row.append(a, el('span', null, (o.size / 1048576).toFixed(2) + ' MB'));
      box.append(row);
    }
  } catch {}
}

async function boot(){
  try {
    const h = await (await fetch('/api/health')).json();
    const ff = $('#ffPill');
    if (h.ffmpeg && h.ffprobe){
      ff.className = 'pill ok';
      ff.textContent = 'ffmpeg 就绪' + (h.ffmpeg_version ? ' · ' + h.ffmpeg_version.replace('ffmpeg version ', '').split(' Copyright')[0] : '');
      ff.title = h.ffmpeg + '\n' + h.ffprobe;
    } else {
      ff.className = 'pill bad';
      ff.textContent = 'ffmpeg 未安装，渲染会失败';
    }
    $('#modelPill').textContent = '模型 · ' + h.model;
    if (h.upload && h.upload.exts){
      $('#fileInput').accept = h.upload.exts.join(',');
      $('#pickBtn').title =
        `支持 ${h.upload.exts.length} 种扩展名，单个上限 ${h.upload.max_mb}MB\n` +
        h.upload.exts.join('  ');
    }
  } catch (e){
    $('#ffPill').className = 'pill bad';
    $('#ffPill').textContent = '后端未响应';
  }
  initUploads();
  loadInputs();
  loadOutputs();
}

$('#send').onclick = () => {
  const v = $('#task').value.trim();
  if (!v || busy) return;
  $('#task').value = '';                 // 发出即清空，避免残留上一条
  $('#task').style.height = 'auto';
  run(v);
};
/* 「启动新任务」：清空上一任务上传的全部素材（后端以白名单为准），
   再重开一局；清理失败（如任务运行中）则保持当前会话不变 */
$('#newTaskBtn').onclick = async () => {
  if (busy) return;
  const old = sessionId;
  try {
    const r = await fetch('/api/session/reset', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: old })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok){
      addError('启动新任务失败：' + (j.error || ('HTTP ' + r.status)) + '，当前会话保持不变。');
      return;
    }
  } catch (e){
    addError('启动新任务失败：' + e.message + '，当前会话保持不变。');
    return;
  }
  sessionId = _newSessionId();
  localStorage.setItem('st_session', sessionId);
  turnCount = 0;
  localStorage.setItem('st_turns_' + sessionId, '0');
  msgsEl.replaceChildren();
  addSys(WELCOME, false);
  resetPanels();
  loadInputs();
  refreshPlaceholder();
  $('#task').value = '';
  $('#task').dispatchEvent(new Event('input'));
  $('#task').focus();
};
$('#task').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('#send').click(); }
});
$('#task').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(150, e.target.scrollHeight) + 'px';
});

refreshPlaceholder();
addSys(WELCOME, false);
boot();
</script>
